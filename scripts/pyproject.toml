[project]
name = "tc-ninja-scripts"
version = "1.0.0"
description = "T&C Ninja - Scraping and embedding pipeline"
requires-python = ">=3.11"
dependencies = [
    "sentence-transformers",
    "numpy<2.0.0",
    "torch>=2.0.0",
    "supabase",
    "requests",
    "python-dotenv",
    "beautifulsoup4",
    "langchain-text-splitters",
    "trafilatura>=2.2.0",
    "playwright>=1.63.0",
    "google-genai>=2.25.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
