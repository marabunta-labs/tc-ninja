[project]
name = "tc-ninja-backend"
version = "1.0.0"
description = "T&C Ninja - RAG backend for analyzing social media Terms & Conditions"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn>=0.30.0,<0.40.0",
    "supabase",
    "httpx",
    "python-dotenv",
    "pydantic",
    "google-genai>=2.25.0",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.scripts]
serve = "uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
