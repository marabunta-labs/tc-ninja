name: Update T&C Database

on:
  schedule:
    # Runs every Sunday at midnight
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform ID to update (e.g. Instagram, TikTok). Leave empty to update all.'
        required: false
        default: ''
      force:
        description: 'Store a new version even if nothing changed or the text shrank a lot.'
        type: boolean
        required: false
        default: false

# Two overlapping runs would fight over the same versions.
concurrency:
  group: update-terms
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-small

      - name: Install dependencies
        working-directory: scripts
        run: uv sync

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('scripts/uv.lock') }}

      - name: Install Playwright Chromium
        working-directory: scripts
        run: uv run playwright install --with-deps chromium

      - name: Run unit tests
        working-directory: scripts
        run: uv run --group dev python -m pytest -q

      # The exit code is non-zero when any platform failed to scrape, so a
      # silently stale database shows up as a red run.
      - name: Run Update Script
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          # Optional: enables the Gemini changelog stored with each new T&C version.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Passed through env (not interpolated into the script) to avoid shell injection.
          INPUT_PLATFORM: ${{ inputs.platform }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          ARGS=()
          if [ -n "$INPUT_PLATFORM" ]; then
            ARGS+=(--platform "$INPUT_PLATFORM")
          fi
          if [ "$INPUT_FORCE" = "true" ]; then
            ARGS+=(--force)
          fi
          uv run python update_terms.py "${ARGS[@]}"
